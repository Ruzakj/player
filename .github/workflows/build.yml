name: Build RIC Player

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build signed release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Enforce APK <= 20 MB
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          BYTES=$(stat -c%s "$APK")
          LIMIT=$((20 * 1024 * 1024))
          echo "APK size: $BYTES bytes"
          if [ "$BYTES" -gt "$LIMIT" ]; then
            echo "APK exceeds 20 MB limit"
            exit 1
          fi

      - name: Verify APK signature
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "app/build/outputs/apk/release/app-release.apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: RIC-Player-v0.2-installable
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  runtime-smoke:
    needs: build
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download installable APK
        uses: actions/download-artifact@v4
        with:
          name: RIC-Player-v0.2-installable
          path: apk

      - name: Emulator runtime smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -eu
            APK="apk/app-release.apk"
            adb install -r "$APK"
            adb logcat -c

            adb shell am force-stop com.ric.player
            adb shell am start -W -n com.ric.player/.MainActivity
            sleep 3
            test -n "$(adb shell pidof com.ric.player)"

            adb shell am start -W -n com.ric.player/.MainActivity -a android.intent.action.VIEW -d "https://storage.googleapis.com/exoplayer-test-media-0/BigBuckBunny_320x180.mp4"
            sleep 6
            test -n "$(adb shell pidof com.ric.player)"

            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1
            sleep 3
            test -n "$(adb shell pidof com.ric.player)"
            adb shell settings put system user_rotation 0
            sleep 3
            test -n "$(adb shell pidof com.ric.player)"

            SIZE=$(adb shell wm size | tail -1 | sed -E 's/.* ([0-9]+)x([0-9]+)/\1 \2/')
            set -- $SIZE
            W=$1
            H=$2
            adb shell input tap $((W/2)) $((H/2))
            sleep 1
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml window.xml >/dev/null
            python3 - <<'PY'
            import re, subprocess, xml.etree.ElementTree as ET
            root = ET.parse('window.xml').getroot()
            for node in root.iter('node'):
                if node.attrib.get('text') == 'PiP':
                    nums = list(map(int, re.findall(r'\d+', node.attrib['bounds'])))
                    x = (nums[0] + nums[2]) // 2
                    y = (nums[1] + nums[3]) // 2
                    subprocess.check_call(['adb','shell','input','tap',str(x),str(y)])
                    break
            else:
                raise SystemExit('PiP control not found in UI hierarchy')
            PY
            sleep 3
            test -n "$(adb shell pidof com.ric.player)"

            adb shell dumpsys activity activities > activity.txt
            if ! grep -Eiq 'PictureInPictureMode=true|picture.?in.?picture.*true' activity.txt; then
              echo "PiP state was not reported by ActivityManager"
              grep -i -C 3 'com.ric.player' activity.txt | tail -n 120 || true
              exit 1
            fi

            adb logcat -d > logcat.txt
            if grep -E 'FATAL EXCEPTION|ANR in com\.ric\.player|Process: com\.ric\.player.*has died' logcat.txt; then
              echo "Runtime crash/ANR detected"
              grep -E -C 20 'FATAL EXCEPTION|ANR in com\.ric\.player|Process: com\.ric\.player.*has died' logcat.txt
              exit 1
            fi

            echo "Runtime smoke test PASS: install, launch, online video, rotation, PiP, no fatal crash/ANR"
