name: Build RIC Player

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply stay-awake playback fix
        if: github.event_name == 'push'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/ric/player/PlayerActivity.java')
          s = p.read_text()

          old = '''            @Override public void onIsPlayingChanged(boolean isPlaying) {
                playPause.setText(isPlaying ? "Pause" : "Play");
            }

            @Override public void onPlaybackStateChanged(int playbackState) {
                updateProgress();
            }'''
          new = '''            @Override public void onIsPlayingChanged(boolean isPlaying) {
                playPause.setText(isPlaying ? "Pause" : "Play");
                updateKeepScreenOn();
            }

            @Override public void onPlaybackStateChanged(int playbackState) {
                updateProgress();
                updateKeepScreenOn();
            }'''
          if old in s:
              s = s.replace(old, new, 1)

          marker = '    private void initControls() {'
          if 'private void updateKeepScreenOn()' not in s:
              method = '''    private void updateKeepScreenOn() {
        boolean keepAwake = player != null
                && player.getPlayWhenReady()
                && player.getPlaybackState() != Player.STATE_ENDED
                && player.getPlaybackState() != Player.STATE_IDLE;
        if (keepAwake) {
            getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
        } else {
            getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
        }
        if (playerView != null) playerView.setKeepScreenOn(keepAwake);
    }

'''
              if marker not in s:
                  raise SystemExit('initControls marker not found')
              s = s.replace(marker, method + marker, 1)

          old_create = '''        updateResponsiveLayout(getResources().getConfiguration());
        uiHandler.post(progressUpdater);'''
          new_create = '''        updateResponsiveLayout(getResources().getConfiguration());
        updateKeepScreenOn();
        uiHandler.post(progressUpdater);'''
          if old_create in s:
              s = s.replace(old_create, new_create, 1)

          p.write_text(s)
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/ric/player/PlayerActivity.java
          if ! git diff --cached --quiet; then
            git commit -m "Keep screen awake during active playback"
            git push origin HEAD:main
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build signed release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Enforce APK <= 20 MB
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          BYTES=$(stat -c%s "$APK")
          LIMIT=$((20 * 1024 * 1024))
          echo "APK size: $BYTES bytes"
          if [ "$BYTES" -gt "$LIMIT" ]; then
            echo "APK exceeds 20 MB limit"
            exit 1
          fi

      - name: Verify APK signature
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "app/build/outputs/apk/release/app-release.apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: RIC-Player-v0.3-installable
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  runtime-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download installable APK
        uses: actions/download-artifact@v4
        with:
          name: RIC-Player-v0.3-installable
          path: apk

      - name: Emulator runtime smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/runtime-smoke.sh
