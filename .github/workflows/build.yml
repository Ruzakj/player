name: Build RIC Player

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Enforce APK <= 20 MB
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          BYTES=$(stat -c%s "$APK")
          LIMIT=$((20 * 1024 * 1024))
          echo "APK size: $BYTES bytes"
          if [ "$BYTES" -gt "$LIMIT" ]; then
            echo "APK exceeds 20 MB limit"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RIC-Player-v0.1-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
